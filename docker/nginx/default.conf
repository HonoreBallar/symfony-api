server {
    listen 80;
    server_name _;
    client_max_body_size 6M;
    root /var/www/html/public;

    # Re-resolve "php" through Docker's DNS so a recreated php container is picked up without restarting nginx
    resolver 127.0.0.11 valid=10s;
    set $php_upstream php:9000;

    # Same JSON envelope as the API when the upload is too large
    error_page 413 @too_large;
    location @too_large {
        default_type application/json;
        charset utf-8;
        return 413 '{"success":false,"message":"Fichier trop volumineux (6 Mo maximum par requête).","errors":[]}';
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass $php_upstream;
        # The first request after a code change rebuilds the Symfony cache, which is slow on a Windows bind mount
        fastcgi_read_timeout 300s;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
